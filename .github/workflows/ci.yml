name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # OBRIGATÓRIO. O go-fitz embarca o MuPDF como biblioteca estática e só a usa
  # com cgo. Com CGO_ENABLED=0 o binário COMPILA e entra em pânico no arranque
  # procurando um libmupdf.so compartilhado. Ver deploy/Dockerfile.
  CGO_ENABLED: "1"

jobs:
  verificar:
    name: lint · teste · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Testes de integração da fase F4. Um serviço do próprio executor, em vez
      # de testcontainers: dispensa daemon Docker acessível ao processo de
      # teste e é a forma idiomática no GitHub Actions.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # cache de módulos e de artefatos de compilação

      # O cache do setup-go não cobre os objetos C do cgo, que são o custo
      # dominante nesta compilação.
      - name: Cache de artefatos C
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: cgo-${{ runner.os }}-${{ hashFiles('**/go.sum', 'deploy/Dockerfile') }}
          restore-keys: cgo-${{ runner.os }}-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Testes
        run: go test ./... -race -shuffle=on -coverprofile=coverage.out -covermode=atomic

      - name: Regra de dependência
        run: go test ./internal -run TestRegraDeDependencia -v

      # `CicloDeVida` entra no filtro porque os testes de ponta a ponta da fase
      # F10 compilam o binário, enviam SINAIS REAIS e conferem o código de
      # saída — é a única verificação de que o encerramento funciona no
      # processo, e não só em memória.
      - name: Testes de integração
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -race -tags=integration -run 'Integration|Integracao|CicloDeVida' -v

      # INV-P16: a data não pode deslocar um dia conforme o fuso do processo.
      - name: Integração com fuso a leste de Greenwich
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TZ: Asia/Tokyo
        run: go test ./internal/adapter/postgres/... -tags=integration -run 'TestIntegracaoData' -v

      - name: Relatório de cobertura
        run: go tool cover -func=coverage.out | tail -40

      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.out
          retention-days: 14

      - name: Build
        run: make build

      - name: go.mod está normalizado
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Os testes de PROPRIEDADE das fases F6 e F7 comparam a implementação Go com
  # o legado em Rust rodando de verdade, caso a caso. São os testes que
  # encontraram as divergências que o corpus dourado não pegou — 320.142 na F6,
  # 13 mais 2 na F7 —, e sem os binários oráculo eles se PULAM em silêncio.
  #
  # Ficam em job separado porque compilar o ferramental em Rust custa caro: o
  # `mupdf-sys` compila o MuPDF do zero. Com o cache do cargo, só a primeira
  # execução paga.
  paridade:
    name: paridade contra o legado em Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/capturar-corpus/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/capturar-corpus/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dependências de compilação do MuPDF
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Compilar os oráculos
        run: make oraculos

      # Sem -race: estes testes não têm concorrência, e o detector triplicaria o
      # tempo de um milhão e meio de casos.
      - name: Testes de paridade e de propriedade
        run: go test ./test/parity/... -v

      # O corpus dourado é versionado. Se recapturá-lo mudar qualquer arquivo, ou
      # o ferramental mudou de comportamento ou a captura não é determinística —
      # as duas coisas invalidam o oráculo.
      - name: O corpus capturado é reprodutível
        run: |
          cargo run --release --manifest-path tools/capturar-corpus/Cargo.toml \
            --bin capturar-corpus -- test/testdata/corpus test/testdata/expected
          git diff --exit-code test/testdata/expected

  imagem:
    name: imagem de distribuição
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: recorte-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSAO=${{ github.sha }}
            REVISAO=${{ github.sha }}

      # Critérios de aceite da fase F1.
      - name: Verificar tamanho, usuário e execução
        run: |
          set -euo pipefail

          bytes=$(docker image inspect recorte-api:ci --format '{{.Size}}')
          limite=$((120 * 1024 * 1024))
          echo "tamanho: $(numfmt --to=iec "$bytes") (limite $(numfmt --to=iec "$limite"))"
          if [ "$bytes" -gt "$limite" ]; then
            echo "imagem acima do limite de 120 MB"
            exit 1
          fi

          usuario=$(docker image inspect recorte-api:ci --format '{{.Config.User}}')
          echo "usuário: ${usuario}"
          case "$usuario" in
            ""|root|0|0:0) echo "a imagem precisa rodar sem privilégio"; exit 1 ;;
          esac

          docker run --rm recorte-api:ci -versao
