name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # OBRIGATÓRIO. O go-fitz embarca o MuPDF como biblioteca estática e só a usa
  # com cgo. Com CGO_ENABLED=0 o binário COMPILA e entra em pânico no arranque
  # procurando um libmupdf.so compartilhado. Ver deploy/Dockerfile.
  CGO_ENABLED: "1"

jobs:
  verificar:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # cache de módulos e de artefatos de compilação

      # O cache do setup-go não cobre os objetos C do cgo, que são o custo
      # dominante nesta compilação.
      - name: Cache de artefatos C
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: cgo-${{ runner.os }}-${{ hashFiles('**/go.sum', 'deploy/Dockerfile') }}
          restore-keys: cgo-${{ runner.os }}-

      - name: Build
        run: make build

  imagem:
    name: imagem de distribuição
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: recorte-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSAO=${{ github.sha }}
            REVISAO=${{ github.sha }}
