[package]
name = "sonda-http"
version = "0.1.0"
edition = "2021"
publish = false

# Sonda do contrato HTTP do legado. Reconstrói o roteador de
# `reference/main.rs:52-60` com o MESMO encadeamento de hoops e pergunta ao
# próprio Salvo o que ele responde nos casos que a especificação marcou como
# `INFERIDO — confirmar`: rota inexistente, método não permitido e o
# `Content-Type` de cada resposta. Ver docs/DECISOES-ABERTAS.md, D-08 e D-10.
#
# ⚠ A VERSÃO do Salvo aqui NÃO é a de produção — essa é a decisão aberta D-15.
# O que a sonda mede vale para a versão fixada abaixo, e o `Cargo.lock` é
# versionado para que a medição seja reproduzível.

[dependencies]
salvo = { version = "0.95", features = ["test", "logging", "request-id", "affix-state"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
chrono = "0.4"

[[bin]]
name = "sonda-http"
path = "src/main.rs"
