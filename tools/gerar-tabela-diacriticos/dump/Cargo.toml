[package]
name = "dump-unicode"
version = "0.1.0"
edition = "2021"
publish = false

# Auxiliar do gerador de tabelas da fase F6.
#
# Imprime, para cada runa do plano básico multilíngue, o que o Rust decide —
# a classificação alfanumérica do SimpleTokenizer e a saída da crate
# `diacritics`. O gerador em Go lê esta saída e emite apenas as DIVERGÊNCIAS
# em relação ao comportamento nativo do Go.
#
# As versões precisam ser as mesmas de tools/capturar-corpus. Ver
# docs/DECISOES-ABERTAS.md, D-15.
[dependencies]
diacritics = "0.2"
regex = "1"
